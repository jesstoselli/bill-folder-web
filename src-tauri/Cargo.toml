[package]
name = "billfolder-desktop"
version = "0.1.0"
description = "BillFolder para macOS"
edition = "2021"
publish = false

[lib]
name = "billfolder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
