<form class="reprice-subscription" [formGroup]="form" (ngSubmit)="submit()">
  <app-dialog-frame
    titleId="reprice-subscription-title"
    heading="Reajustar assinatura"
    closeLabel="Fechar reajuste de assinatura"
    [saving]="saving()"
    [error]="serverError()"
    submitLabel="Salvar novo valor"
    savingLabel="Reajustando…"
  >
    <p dialogSubtitle id="reprice-subscription-description">{{ data.entry.label }}</p>
    <p class="reprice-subscription__current">
      Valor atual <strong><app-money [value]="data.entry.totalAmount" /></strong>
    </p>

    <mat-form-field appearance="outline">
      <mat-label>Novo valor mensal</mat-label>
      <span matTextPrefix>R$&nbsp;</span>
      <input matInput appMoneyInput formControlName="amount" />
      @if (form.controls.amount.invalid) {
        <mat-error>Informe um valor maior que zero.</mat-error>
      }
    </mat-form-field>
  </app-dialog-frame>
</form>
