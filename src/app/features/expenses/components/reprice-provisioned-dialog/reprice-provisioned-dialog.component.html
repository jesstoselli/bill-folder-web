<form class="reprice-dialog" [formGroup]="form" (ngSubmit)="submit()">
  <app-dialog-frame
    titleId="reprice-provisioned-title"
    heading="Reajustar valor por sessão"
    closeLabel="Fechar reajuste"
    [saving]="saving()"
    [error]="serverError()"
    submitLabel="Salvar novo valor"
    savingLabel="Reajustando…"
  >
    <p dialogSubtitle id="reprice-provisioned-description">{{ data.expense.label }}</p>
    <mat-form-field appearance="outline">
      <mat-label>Novo valor por sessão</mat-label>
      <span matTextPrefix>R$&nbsp;</span>
      <input matInput appMoneyInput formControlName="amount" />
      @if (form.controls.amount.invalid) {
        <mat-error>Informe um valor maior que zero.</mat-error>
      }
    </mat-form-field>

    <section class="reprice-dialog__context" aria-live="polite">
      <span>Total recalculado neste ciclo</span>
      <strong><app-money [value]="recalculatedTotal()" /></strong>
      <p>
        O total é calculado automaticamente para
        {{ data.expense.occurrencesTotal }} ocorrências. Você está alterando apenas o valor por
        sessão.
      </p>
    </section>
  </app-dialog-frame>
</form>
