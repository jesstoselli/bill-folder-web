<form class="confirm-income" [formGroup]="form" (ngSubmit)="submit()">
  <app-dialog-frame
    titleId="confirm-income-title"
    heading="Confirmar recebimento"
    closeLabel="Fechar confirmação de recebimento"
    [saving]="saving()"
    [error]="serverError()"
    submitLabel="Confirmar recebimento"
    savingLabel="Confirmando…"
  >
    <p id="confirm-income-description">
      Registre quanto e quando {{ data.entry.sourceOrigin ?? 'este recebimento avulso' }} entrou.
    </p>
    <div class="confirm-income__fields">
      <mat-form-field appearance="outline">
        <mat-label>Valor recebido</mat-label><span matTextPrefix>R$&nbsp;</span>
        <input matInput appMoneyInput formControlName="actualAmount" />
        @if (form.controls.actualAmount.invalid) {
          <mat-error>Informe um valor maior que zero.</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Data do recebimento</mat-label
        ><input matInput type="date" formControlName="actualDate" />
        @if (form.controls.actualDate.invalid) {
          <mat-error>Informe uma data válida.</mat-error>
        }
      </mat-form-field>
    </div>
  </app-dialog-frame>
</form>
