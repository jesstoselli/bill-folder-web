<section class="cycle-navigator" aria-label="Navegação entre ciclos">
  <button
    type="button"
    appNavigationArrow
    direction="previous"
    aria-label="Ciclo anterior"
    [disabled]="!previousEnabled()"
    (click)="previous.emit()"
  ></button>

  <div class="cycle-navigator__content" aria-live="polite">
    <strong class="cycle-navigator__label">{{ label() }}</strong>
    <span class="cycle-navigator__dates">
      <time [attr.datetime]="startDate()">{{ formatCivilDate(startDate()) }}</time>
      <span aria-hidden="true">–</span>
      <time [attr.datetime]="endDate()">{{ formatCivilDate(endDate()) }}</time>
    </span>
  </div>

  <button
    type="button"
    appNavigationArrow
    direction="next"
    aria-label="Próximo ciclo"
    [disabled]="!nextEnabled()"
    (click)="next.emit()"
  ></button>
</section>
