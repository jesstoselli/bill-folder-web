<section class="confirm-action">
  <header>
    <h2 mat-dialog-title>{{ data.title }}</h2>
  </header>

  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" appButton variant="text" (click)="cancel()">
      {{ data.cancelLabel ?? 'Cancelar' }}
    </button>
    <button type="button" appButton variant="secondary" tone="danger" (click)="confirm()">
      {{ data.confirmLabel }}
    </button>
  </mat-dialog-actions>
</section>
