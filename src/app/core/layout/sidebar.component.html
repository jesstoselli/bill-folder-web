<div class="sidebar__brand" [class.sidebar__brand--compact]="mode() === 'rail'">
  @if (mode() === 'rail') {
    <img
      class="sidebar__brand-symbol"
      src="/brand/billfolder-symbol.svg"
      alt=""
      aria-hidden="true"
    />
  } @else {
    <img class="sidebar__brand-logo" src="/brand/billfolder-wordmark.svg" alt="BillFolder" />
  }
</div>

<nav aria-label="Navegação principal">
  <ul class="sidebar__list">
    @for (destination of destinations; track destination.path) {
      <li>
        <a
          class="sidebar__link"
          [class.sidebar__link--active]="isActive(destination.path)"
          [routerLink]="destination.path"
          [attr.aria-current]="isActive(destination.path) ? 'page' : null"
          [attr.aria-label]="destination.label"
          [matTooltip]="destination.label"
          [matTooltipDisabled]="mode() !== 'rail'"
          matTooltipPosition="right"
          (click)="navigationRequested.emit()"
        >
          <app-icon [name]="destination.icon" />
          <span class="sidebar__label" [class.u-visually-hidden]="mode() === 'rail'">
            {{ destination.label }}
          </span>
        </a>
      </li>
    }
  </ul>
</nav>

<div class="sidebar__footer">
  <button
    class="sidebar__logout"
    type="button"
    aria-label="Sair"
    matTooltip="Sair"
    [matTooltipDisabled]="mode() !== 'rail'"
    matTooltipPosition="right"
    (click)="logoutRequested.emit()"
  >
    <app-icon name="logout" />
    <span [class.u-visually-hidden]="mode() === 'rail'">Sair</span>
  </button>
</div>
